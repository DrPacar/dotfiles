<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f17"/>
      <stop offset="50%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>

    <!-- Celestial Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="60%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <!-- Atmosphere Glows -->
    <radialGradient id="nebulaBlue" cx="68%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="30%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="horizonGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#bb9af7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="peakFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>

    <linearGradient id="peakMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>

    <linearGradient id="peakNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="3840" height="2160" fill="url(#skyGrad)"/>

  <!-- Nebulae -->
  <rect width="3840" height="2160" fill="url(#nebulaBlue)"/>
  <rect width="3840" height="2160" fill="url(#nebulaPurple)"/>
  <rect width="3840" height="2160" fill="url(#horizonGlow)"/>

  <!-- Stars -->
  <g fill="#c0caf5">
    <circle cx="280" cy="180" r="1.5" opacity="0.8"/>
    <circle cx="450" cy="320" r="2.2" opacity="0.9"/>
    <circle cx="680" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="890" cy="270" r="2.0" opacity="0.75"/>
    <circle cx="1120" cy="190" r="1.8" opacity="0.85"/>
    <circle cx="1340" cy="360" r="1.4" opacity="0.5"/>
    <circle cx="1570" cy="120" r="2.5" opacity="0.9"/>
    <circle cx="1780" cy="240" r="1.6" opacity="0.7"/>
    <circle cx="1980" cy="160" r="2.0" opacity="0.8"/>
    <circle cx="2180" cy="310" r="1.3" opacity="0.65"/>
    <circle cx="2390" cy="150" r="2.4" opacity="0.9"/>
    <circle cx="2950" cy="190" r="1.7" opacity="0.8"/>
    <circle cx="3180" cy="340" r="2.0" opacity="0.75"/>
    <circle cx="3420" cy="170" r="1.5" opacity="0.85"/>
    <circle cx="3650" cy="280" r="2.2" opacity="0.9"/>
    <circle cx="160" cy="520" r="1.8" opacity="0.7"/>
    <circle cx="390" cy="680" r="1.4" opacity="0.6"/>
    <circle cx="620" cy="490" r="2.0" opacity="0.85"/>
    <circle cx="830" cy="610" r="1.6" opacity="0.7"/>
    <circle cx="1040" cy="450" r="2.2" opacity="0.9"/>
    <circle cx="1290" cy="580" r="1.3" opacity="0.55"/>
    <circle cx="1510" cy="440" r="1.9" opacity="0.8"/>
    <circle cx="1720" cy="590" r="1.5" opacity="0.7"/>
    <circle cx="1920" cy="420" r="2.4" opacity="0.9"/>
    <circle cx="2150" cy="560" r="1.6" opacity="0.65"/>
    <circle cx="3040" cy="490" r="2.1" opacity="0.85"/>
    <circle cx="3290" cy="620" r="1.4" opacity="0.6"/>
    <circle cx="3520" cy="460" r="2.3" opacity="0.9"/>
    <circle cx="3720" cy="580" r="1.7" opacity="0.75"/>
    <circle cx="510" cy="850" r="1.8" opacity="0.6"/>
    <circle cx="980" cy="790" r="2.0" opacity="0.7"/>
    <circle cx="1450" cy="760" r="1.5" opacity="0.65"/>
    <circle cx="3380" cy="780" r="1.9" opacity="0.75"/>
  </g>

  <!-- Glowing Moon / Sphere -->
  <g transform="translate(2620, 680)">
    <!-- Outer Aura Rings -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#7aa2f7" stroke-width="1.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="270" fill="none" stroke="#bb9af7" stroke-width="1" opacity="0.12" stroke-dasharray="8 12"/>
    <circle cx="0" cy="0" r="170" fill="url(#moonGrad)" opacity="0.95"/>
    <!-- Moon shadow creating sleek crescent -->
    <circle cx="-35" cy="-25" r="155" fill="#16161e" opacity="0.92"/>
    <!-- Accent Sparkle -->
    <circle cx="75" cy="55" r="4" fill="#7dcfff" opacity="0.9"/>
    <circle cx="95" cy="40" r="2" fill="#c0caf5" opacity="0.8"/>
  </g>

  <!-- Subtle Horizon Light Line -->
  <line x1="0" y1="1380" x2="3840" y2="1380" stroke="#7aa2f7" stroke-width="1.5" opacity="0.25"/>

  <!-- Mountain Range 1 (Far Background) -->
  <polygon points="
    0,1480 280,1310 560,1440 920,1230 1280,1410 1640,1190 2020,1390 2380,1210 2740,1380 3100,1220 3480,1390 3840,1260
    3840,2160 0,2160"
    fill="url(#peakFar)"/>

  <!-- Mountain Range 2 (Mid Ground) -->
  <polygon points="
    0,1650 340,1460 710,1620 1080,1410 1480,1590 1860,1370 2240,1580 2620,1390 3010,1570 3420,1380 3840,1540
    3840,2160 0,2160"
    fill="url(#peakMid)"/>

  <!-- Mountain Range 3 (Foreground Silhouettes) -->
  <polygon points="
    0,1860 420,1680 880,1840 1320,1650 1780,1830 2220,1630 2690,1820 3140,1640 3580,1810 3840,1720
    3840,2160 0,2160"
    fill="url(#peakNear)"/>

  <!-- Subtle Neon Geometric Accent -->
  <path d="M 1720 1830 L 1920 1670 L 2120 1830" fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.4"/>
  <path d="M 1820 1830 L 1920 1750 L 2020 1830" fill="none" stroke="#bb9af7" stroke-width="1.5" opacity="0.3"/>
</svg>
